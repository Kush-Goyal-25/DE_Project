services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-cpd}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-cpd}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  dashboard:
    build: .
    image: crime-trends-dashboard:latest
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres   # the service name, not localhost
      POSTGRES_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - dashboard-data:/app/data
    restart: unless-stopped

volumes:
  postgres-data:
  dashboard-data:
